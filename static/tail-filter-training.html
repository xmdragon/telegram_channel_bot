<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 尾部过滤训练 - AI训练中心</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 动态版本号 - 防缓存 -->
    <script>window.RESOURCE_VERSION = Date.now();</script>
    <script>
        document.write('<link rel="stylesheet" href="assets/css/simple-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/modern-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/components/inline-styles.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/training-common.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/training-nav.css?v=' + RESOURCE_VERSION + '">');
    </script>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav-bar page-title="📝 尾部过滤训练"></nav-bar>
        
        <div class="container">
            <!-- 子导航 -->
            <training-nav active-tab="tail"></training-nav>
            
            <!-- 尾部过滤训练表单 -->
            <div class="config-section">
                <div class="form-card">
                    <div class="card-header">
                        <h3>📝 尾部过滤训练</h3>
                    </div>
                    
                    <form class="training-form">
                        <div class="form-group">
                            <label class="form-label required">原始消息内容</label>
                            <!-- 内容类型指示器 -->
                            <div v-if="trainingForm.contentType" class="content-indicator" 
                                 :class="trainingForm.contentType === 'filtered' ? 'filtered' : 'original'">
                                <span v-if="trainingForm.contentType === 'filtered'">
                                    🔍 已加载过滤后内容 - 便于选择尾部特征
                                </span>
                                <span v-else>
                                    📄 已加载原始内容
                                </span>
                            </div>
                            <textarea
                                class="form-textarea"
                                v-model="trainingForm.original_message"
                                rows="8"
                                placeholder="粘贴完整的原始消息内容，包括正文和尾部推广..."
                                @input="updatePreview"></textarea>
                            <div class="char-count">{{ trainingForm.original_message.length }} 字符</div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">推广尾部内容</label>
                            <textarea
                                class="form-textarea"
                                v-model="trainingForm.tail_content"
                                rows="6"
                                placeholder="粘贴需要过滤的尾部内容，如：&#10;👌订阅频道：@miandianDs&#10;👌投稿爆料：@QianQian106&#10;👌海外交友：@tmiandianKs"
                                @input="updatePreview"></textarea>
                            <div class="char-count">{{ trainingForm.tail_content.length }} 字符</div>
                        </div>
                        
                        <!-- 预览区域 -->
                        <div class="form-group" v-if="filteredPreview">
                            <label class="form-label">过滤后预览</label>
                            <div class="preview-box">
                                <pre>{{ filteredPreview }}</pre>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" @click="clearForm">清空</button>
                            <button type="button" class="btn btn-primary" @click="submitTraining" :disabled="submitting">
                                <span v-if="submitting">提交中...</span>
                                <span v-else>提交训练样本</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            
            <!-- 消息提示已使用 SimpleUI -->
        </div>
    </div>

    <!-- 动态加载JavaScript文件 -->
    <script>
        document.write('<script src="assets/js/vue.prod.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/core/simple-ui.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/axios.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/axios-config.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/api-endpoints.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/admin-auth.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/navbar.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/training-nav.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/tail-filter-training.js?v=' + RESOURCE_VERSION + '"><\/script>');
    </script>
</body>
</html>
