<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Telegram双Session认证</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 动态版本号 - 防缓存 -->
    <script>window.RESOURCE_VERSION = Date.now();</script>
    <script>
        document.write('<link rel="stylesheet" href="assets/css/simple-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/modern-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/components/inline-styles.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/components/auth.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/components/dual-session-auth.css?v=' + RESOURCE_VERSION + '">');
    </script>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav-bar page-title="📱 Telegram双Session认证"></nav-bar>

        <div class="container">
            <!-- 双Session认证界面 -->
            <div class="dual-session-container">
                <!-- API配置提示 -->
                <div v-if="!hasSharedApi" class="api-config-prompt">
                    <div class="prompt-card">
                        <div class="prompt-icon">🔧</div>
                        <div class="prompt-content">
                            <h3 class="prompt-title">需要配置 Telegram API</h3>
                            <p class="prompt-text">在开始认证之前，请先在系统配置中设置您的 API ID 和 API Hash</p>
                            <div class="prompt-actions">
                                <button class="btn btn-primary btn-lg" @click="goToConfig">
                                    配置 API_ID / API_HASH
                                </button>
                                <button class="btn btn-secondary" @click="checkApiConfig">
                                    重新检查配置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 双Session认证区域 -->
                <div v-if="hasSharedApi" class="dual-session-auth">
                    <!-- 采集Session认证 -->
                    <div class="session-card listener-session">
                        <div class="session-header success-theme">
                            <h3>📡 采集认证</h3>
                            <span class="session-purpose">用于监听和采集消息</span>
                        </div>
                        
                        <div class="session-content">
                            <!-- 步骤指示器 -->
                            <div class="step-indicator">
                                <div class="step" :class="{ active: listenerSession.currentStep >= 1, completed: listenerSession.currentStep > 1 }">手机</div>
                                <div class="step-line"></div>
                                <div class="step" :class="{ active: listenerSession.currentStep >= 2, completed: listenerSession.currentStep > 2 }">验证</div>
                                <div class="step-line"></div>
                                <div class="step" :class="{ active: listenerSession.currentStep >= 3, completed: listenerSession.currentStep > 3 }">完成</div>
                            </div>
                            
                            <!-- 认证步骤 -->
                            <div v-if="!listenerSession.completed">
                                <!-- 手机号步骤 -->
                                <div v-if="listenerSession.currentStep === 1" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">手机号码</label>
                                        <input class="form-input" 
                                               v-model="listenerSession.phone" 
                                               placeholder="请输入手机号码 (格式: +8613800138000)"
                                               type="text">
                                    </div>
                                    <button class="btn btn-success" 
                                            @click="sendCode('listener')" 
                                            :disabled="!listenerSession.phone || listenerSession.loading">
                                        <span v-if="listenerSession.loading" class="btn-icon">⏳</span>
                                        采集认证
                                    </button>
                                </div>
                                
                                <!-- 验证码步骤 -->
                                <div v-if="listenerSession.currentStep === 2" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">验证码</label>
                                        <input class="form-input" 
                                               v-model="listenerSession.verificationCode" 
                                               placeholder="请输入收到的验证码"
                                               type="text">
                                    </div>
                                    <button class="btn btn-success" 
                                            @click="verifyCode('listener')" 
                                            :disabled="!listenerSession.verificationCode || listenerSession.loading">
                                        <span v-if="listenerSession.loading" class="btn-icon">⏳</span>
                                        验证
                                    </button>
                                </div>
                                
                                <!-- 两步验证步骤 -->
                                <div v-if="listenerSession.currentStep === 3 && listenerSession.needsPassword" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">两步验证密码</label>
                                        <input class="form-input" 
                                               v-model="listenerSession.password" 
                                               placeholder="请输入两步验证密码"
                                               type="password">
                                    </div>
                                    <button class="btn btn-success" 
                                            @click="verifyPassword('listener')" 
                                            :disabled="!listenerSession.password || listenerSession.loading">
                                        <span v-if="listenerSession.loading" class="btn-icon">⏳</span>
                                        验证密码
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 完成状态 -->
                            <div v-if="listenerSession.completed" class="auth-complete">
                                <div class="success-icon">✅</div>
                                <p class="success-text">采集认证完成</p>
                                <button class="btn btn-outline-danger" @click="clearSession('listener')">
                                    重新认证
                                </button>
                            </div>
                            
                            <!-- 错误信息 -->
                            <div v-if="listenerSession.errorMessage" class="error-message-small">
                                {{ listenerSession.errorMessage }}
                            </div>
                        </div>
                    </div>
                    
                    <!-- 发送Session认证 -->
                    <div class="session-card sender-session">
                        <div class="session-header primary-theme">
                            <h3>📤 发布认证</h3>
                            <span class="session-purpose">用于发送和转发消息</span>
                        </div>
                        
                        <div class="session-content">
                            <!-- 步骤指示器 -->
                            <div class="step-indicator">
                                <div class="step" :class="{ active: senderSession.currentStep >= 1, completed: senderSession.currentStep > 1 }">手机</div>
                                <div class="step-line"></div>
                                <div class="step" :class="{ active: senderSession.currentStep >= 2, completed: senderSession.currentStep > 2 }">验证</div>
                                <div class="step-line"></div>
                                <div class="step" :class="{ active: senderSession.currentStep >= 3, completed: senderSession.currentStep > 3 }">完成</div>
                            </div>
                            
                            <!-- 认证步骤 -->
                            <div v-if="!senderSession.completed">
                                <!-- 手机号步骤 -->
                                <div v-if="senderSession.currentStep === 1" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">手机号码</label>
                                        <input class="form-input" 
                                               v-model="senderSession.phone" 
                                               placeholder="请输入手机号码 (格式: +8613800138000)"
                                               type="text">
                                    </div>
                                    <button class="btn btn-primary" 
                                            @click="sendCode('sender')" 
                                            :disabled="!senderSession.phone || senderSession.loading">
                                        <span v-if="senderSession.loading" class="btn-icon">⏳</span>
                                        发布认证
                                    </button>
                                </div>
                                
                                <!-- 验证码步骤 -->
                                <div v-if="senderSession.currentStep === 2" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">验证码</label>
                                        <input class="form-input" 
                                               v-model="senderSession.verificationCode" 
                                               placeholder="请输入收到的验证码"
                                               type="text">
                                    </div>
                                    <button class="btn btn-primary" 
                                            @click="verifyCode('sender')" 
                                            :disabled="!senderSession.verificationCode || senderSession.loading">
                                        <span v-if="senderSession.loading" class="btn-icon">⏳</span>
                                        验证
                                    </button>
                                </div>
                                
                                <!-- 两步验证步骤 -->
                                <div v-if="senderSession.currentStep === 3 && senderSession.needsPassword" class="auth-step">
                                    <div class="form-group">
                                        <label class="form-label">两步验证密码</label>
                                        <input class="form-input" 
                                               v-model="senderSession.password" 
                                               placeholder="请输入两步验证密码"
                                               type="password">
                                    </div>
                                    <button class="btn btn-primary" 
                                            @click="verifyPassword('sender')" 
                                            :disabled="!senderSession.password || senderSession.loading">
                                        <span v-if="senderSession.loading" class="btn-icon">⏳</span>
                                        验证密码
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 完成状态 -->
                            <div v-if="senderSession.completed" class="auth-complete">
                                <div class="success-icon">✅</div>
                                <p class="success-text">发布认证完成</p>
                                <button class="btn btn-outline-danger" @click="clearSession('sender')">
                                    重新认证
                                </button>
                            </div>
                            
                            <!-- 错误信息 -->
                            <div v-if="senderSession.errorMessage" class="error-message-small">
                                {{ senderSession.errorMessage }}
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 底部操作 -->
                <div v-if="hasSharedApi && bothSessionsCompleted" class="bottom-actions">
                    <div class="text-center">
                        <div class="success-icon-large">🎉</div>
                        <h3 class="success-title-large">双Session认证完成！</h3>
                        <p class="success-text">采集和发布功能已就绪</p>
                        
                        <div class="flex-gap-16 mt-32">
                            <button class="btn btn-primary btn-lg" @click="goToMain">
                                进入系统
                            </button>
                            <button class="btn btn-secondary btn-lg" @click="resetAllSessions">
                                重新配置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 状态消息 -->
        <div v-if="statusMessage" class="status-message" :class="statusType">
            {{ statusMessage }}
        </div>
        
        <!-- 加载遮罩 -->
        <div v-if="loading" class="loading-overlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">{{ loadingMessage }}</p>
            </div>
        </div>
    </div>
    <!-- 动态加载JavaScript文件 -->
    <script>
        document.write('<script src="assets/js/vue.prod.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/core/simple-ui.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/axios.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/axios-config.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/api-endpoints.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/utils/websocket-factory.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/admin-auth.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/navbar.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/telegram-dual-auth.js?v=' + RESOURCE_VERSION + '"><\/script>');
    </script>


</body>
</html>
