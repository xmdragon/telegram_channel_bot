<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Telegram认证</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="assets/css/simple-ui.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/modern-ui.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/components/auth.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/components/inline-styles.css?v=1755809999">
    
    <!-- JavaScript 库 -->
    <!-- 🔥 Linus式核心库：立即加载确保API对象可用 -->
    <script src="assets/js/vue.prod.js?v=1755809999"></script>
    <!-- 轻量级UI系统 -->
    <script src="assets/js/core/simple-ui.js?v=1755809999"></script>
    <script src="assets/js/axios.js?v=1755809999"></script>
    <script src="assets/js/config/axios-config.js?v=1755809999"></script>
    <script src="assets/js/config/api-endpoints.js?v=1755809999"></script>
    <script src="assets/js/admin-auth.js?v=1755809999"></script>
    <script src="assets/js/components/navbar.js?v=1755809999"></script>
    <script src="assets/js/components/telegram-auth.js?v=1755809999"></script>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav-bar page-title="📱 Telegram认证"></nav-bar>

        <div class="container">
            <div class="form-container">
                <div class="form-title">Telegram 认证</div>
                
                <!-- 已保存的认证信息 -->
                <div v-if="showSavedInfo" class="saved-auth-info">
                    <div class="text-center mb-32">
                        <div class="success-icon">✅</div>
                        <h3 class="success-title">认证成功！</h3>
                        <p class="success-text">Telegram 客户端已成功连接</p>
                    </div>
                    
                    <div class="auth-info-item">
                        <label>API ID:</label>
                        <span>{{ savedAuthInfo.api_id }}</span>
                    </div>
                    <div class="auth-info-item">
                        <label>API Hash:</label>
                        <span>{{ savedAuthInfo.api_hash ? '••••••••••••••••••••••••••••••••' : '未设置' }}</span>
                    </div>
                    
                    <div class="text-center mt-32 flex-gap-16">
                        <button class="btn btn-primary btn-lg min-w-120" @click="goToMain">
                            进入系统
                        </button>
                        <button class="btn btn-secondary btn-lg min-w-120" 
                                @click="startReAuth" 
                                :disabled="loading">
                            <span v-if="loading" class="btn-icon">⏳</span>
                            重新认证
                        </button>
                        <button class="btn btn-danger btn-lg min-w-120" 
                                @click="clearAuthData" 
                                :disabled="loading || !hasSavedSession">
                            <span v-if="loading" class="btn-icon">⏳</span>
                            清除数据
                        </button>
                    </div>
                </div>
                
                <!-- 步骤指示器 -->
                <div v-if="!showSavedInfo" class="step-indicator">
                    <div class="step" :class="{ active: currentStep >= 1, completed: currentStep > 1 }">配置</div>
                    <div class="step-line"></div>
                    <div class="step" :class="{ active: currentStep >= 2, completed: currentStep > 2 }">手机</div>
                    <div class="step-line"></div>
                    <div class="step" :class="{ active: currentStep >= 3, completed: currentStep > 3 }">验证</div>
                    <div class="step-line"></div>
                    <div class="step" :class="{ active: currentStep >= 4, completed: currentStep > 4 }">两步</div>
                    <div class="step-line"></div>
                    <div class="step" :class="{ active: currentStep >= 5, completed: currentStep > 5 }">完成</div>
                </div>

                <!-- 步骤1: 配置信息 -->
                <div v-if="!showSavedInfo" class="form-step" :class="{ active: currentStep === 1 }">
                    <div class="form-group">
                        <label class="form-label">API ID</label>
                        <input class="form-input" 
                               v-model="config.api_id" 
                               placeholder="请输入 Telegram API ID"
                               type="text">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">API Hash</label>
                        <input class="form-input" 
                               v-model="config.api_hash" 
                               placeholder="请输入 Telegram API Hash"
                               type="text">
                    </div>
                    
                    
                    <div class="text-center mt-30">
                        <button class="btn btn-primary" 
                                @click="submitConfig" 
                                :disabled="!canProceed || loading">
                            <span v-if="loading" class="btn-icon">⏳</span>
                            提交配置
                        </button>
                    </div>
                </div>

                <!-- 步骤2: 手机号码 -->
                <div v-if="!showSavedInfo" class="form-step" :class="{ active: currentStep === 2 }">
                    <div class="form-group">
                        <label class="form-label">手机号码</label>
                        <input class="form-input" 
                               v-model="config.phone" 
                               placeholder="请输入手机号码 (格式: +8613800138000)"
                               type="text">
                    </div>
                    
                    <div class="text-center mt-30">
                        <button class="btn btn-secondary" @click="prevStep">
                            上一步
                        </button>
                        <button class="btn btn-primary" @click="sendCode" :disabled="loading">
                            <span v-if="loading" class="btn-icon">⏳</span>
                            发送验证码
                        </button>
                    </div>
                </div>

                <!-- 步骤3: 验证码 -->
                <div v-if="!showSavedInfo" class="form-step" :class="{ active: currentStep === 3 }">
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <input class="form-input" 
                               v-model="verificationCode" 
                               placeholder="请输入收到的验证码"
                               type="text">
                    </div>
                    
                    <div class="text-center mt-30">
                        <button class="btn btn-secondary" @click="prevStep">
                            上一步
                        </button>
                        <button class="btn btn-primary" @click="verifyCode" :disabled="verifying">
                            <span v-if="verifying" class="btn-icon">⏳</span>
                            验证
                        </button>
                    </div>
                </div>

                <!-- 步骤4: 两步验证 -->
                <div v-if="!showSavedInfo" class="form-step" :class="{ active: currentStep === 4 }">
                    <div class="form-group">
                        <label class="form-label">两步验证密码</label>
                        <input class="form-input" 
                               v-model="password" 
                               placeholder="请输入两步验证密码"
                               type="password">
                    </div>
                    
                    <div class="text-center mt-30">
                        <button class="btn btn-secondary" @click="prevStep">
                            上一步
                        </button>
                        <button class="btn btn-primary" @click="verifyPassword" :disabled="verifying">
                            <span v-if="verifying" class="btn-icon">⏳</span>
                            验证
                        </button>
                    </div>
                </div>

                <!-- 步骤5: 完成 -->
                <div v-if="!showSavedInfo" class="form-step" :class="{ active: currentStep === 5 }">
                    <div class="text-center" style="margin: 32px 0;">
                        <div class="success-icon-large">✅</div>
                        <h3 class="success-title-large">认证成功！</h3>
                        <p class="success-text">Telegram 客户端已成功连接</p>
                    </div>
                    
                    <div class="text-center mt-32">
                        <button class="btn btn-primary btn-lg min-w-140" @click="goToMain">
                            进入系统
                        </button>
                    </div>
                </div>

                <!-- 错误信息 -->
                <div v-if="errorMessage" class="error-message">
                    {{ errorMessage }}
                </div>
            </div>
        </div>
        
        <!-- 状态消息 -->
        <div v-if="statusMessage" class="status-message" :class="statusType">
            {{ statusMessage }}
        </div>
        
        <!-- 加载遮罩 -->
        <div v-if="loading" class="loading-overlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">{{ loadingMessage }}</p>
            </div>
        </div>
    </div>

</body>
</html>
