<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 系统日志</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/css/simple-ui.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/modern-ui.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/components/inline-styles.css?v=1755809999">
</head>
<body>
    <div id="app">
        <nav-bar page-title="📋 系统日志"></nav-bar>
        
        <div class="container">
            <div class="logs-container">
                        <!-- 控制栏 -->
                        <div class="control-bar">
                            <div class="card">
                                <div class="card-content">
                                    <div class="flex-gap-15">
                                        <!-- 日志类型选择 -->
                                        <select v-model="selectedLogType" @change="changeLogType" class="select w-160">
                                            <option value="collector">📡 Telegram采集</option>
                                            <option value="web">🌐 Web服务</option>
                                            <option value="scheduler">⏰ 调度服务</option>
                                            <option value="error">❌ 错误日志</option>
                                            <option value="all">📄 全部日志</option>
                                        </select>
                                        
                                        <!-- 日志级别选择 -->
                                        <select v-model="selectedLevel" @change="filterLogs" class="select w-140">
                                            <option value="">全部</option>
                                            <option value="DEBUG">DEBUG</option>
                                            <option value="INFO">INFO</option>
                                            <option value="WARNING">WARNING</option>
                                            <option value="ERROR">ERROR</option>
                                            <option value="CRITICAL">CRITICAL</option>
                                        </select>
                                        
                                        <!-- 搜索框 -->
                                        <div class="input-group flex-1 max-w-400">
                                            <span class="input-icon">🔍</span>
                                            <input 
                                                v-model="searchText" 
                                                @input="filterLogs"
                                                placeholder="搜索日志内容..." 
                                                class="input"
                                                type="text"
                                            />
                                            <button v-if="searchText" @click="searchText = ''; filterLogs();" class="clear-btn">×</button>
                                        </div>
                                        
                                        <!-- 按钮组 -->
                                        <div class="margin-auto flex-gap-10">
                                            <button @click="toggleAutoRefresh" :class="'btn ' + (autoRefresh ? 'btn-success' : 'btn-info')">
                                                <span class="btn-icon">⏰</span>
                                                {{ autoRefresh ? '停止自动刷新' : '开始自动刷新' }}
                                            </button>
                                            <button @click="clearLogs" class="btn btn-warning">
                                                <span class="btn-icon">🗑️</span>
                                                清空日志
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 日志显示区域 -->
                        <div class="card logs-display">
                            <div class="card-header">
                                <div class="logs-header">
                                    <h3>{{ getLogTypeLabel() }}日志 <span class="timestamp">{{ lastUpdate }}</span></h3>
                                    <p class="text-12 text-info" style="margin: 0;">
                                        📌 最新日志显示在顶部，按时间倒序排列 | 当前显示: {{ getLogTypeLabel() }}
                                    </p>
                                </div>
                            </div>
                            
                            <div class="card-content">
                                <div class="logs-content" ref="logsContainer">
                                    <div v-if="filteredLogs.length === 0" class="no-logs">
                                        <div class="empty-state">
                                            <div class="empty-icon">📄</div>
                                            <div class="empty-text">暂无日志数据</div>
                                        </div>
                                    </div>
                                    
                                    <div 
                                        v-for="(log, index) in filteredLogs" 
                                        :key="index" 
                                        class="log-entry"
                                        :class="'log-level-' + (log.level || 'info').toLowerCase()"
                                    >
                                        <div class="log-compact">
                                            <span class="log-time">{{ formatTime(log.timestamp || log.time || '') }}</span>
                                            <span :class="'log-level log-level-' + (log.level || 'info').toLowerCase()">{{ log.level || 'INFO' }}</span>
                                            <span class="log-text">{{ log.message || log.content || 'No message' }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

            </div>
        </div>
    </div>

    <!-- Vue -->
    <script defer src="assets/js/vue.prod.js?v=1755809999"></script>
    <!-- 轻量级UI系统 -->
    <script defer src="assets/js/core/simple-ui.js?v=1755809999"></script>
    <script defer src="assets/js/axios.js?v=1755809999"></script>
    <script defer src="assets/js/config/axios-config.js?v=1755809999"></script>
    <script defer src="assets/js/config/api-endpoints.js?v=1755809999"></script>
    <script defer src="assets/js/components/navbar.js?v=1755809999"></script>
    
    <!-- 页面脚本 -->
    <script defer src="assets/js/components/logs.js?v=1755809999"></script>

</body>
</html>
