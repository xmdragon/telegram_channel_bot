<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 系统日志</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/css/element-plus.css?v=1755703604">
    <link rel="stylesheet" href="assets/css/element-plus-fixes.css?v=1755703604">
    <link rel="stylesheet" href="assets/css/modern-ui.css?v=1755703604">
</head>
<body>
    <div id="app">
        <nav-bar page-title="📋 系统日志"></nav-bar>
        
        <div class="container">
            <div class="logs-container">
                        <!-- 控制栏 -->
                        <el-row :gutter="20" class="control-bar">
                            <el-col :span="24">
                                <el-card shadow="never">
                                    <div style="display: flex; align-items: center; gap: 15px;">
                                        <!-- 日志类型选择 -->
                                        <el-select v-model="selectedLogType" placeholder="选择日志类型" @change="changeLogType" style="width: 160px;">
                                            <el-option label="📡 Telegram采集" value="collector"></el-option>
                                            <el-option label="🌐 Web服务" value="web"></el-option>
                                            <el-option label="⏰ 调度服务" value="scheduler"></el-option>
                                            <el-option label="❌ 错误日志" value="error"></el-option>
                                            <el-option label="📄 全部日志" value="all"></el-option>
                                        </el-select>
                                        
                                        <!-- 日志级别选择 -->
                                        <el-select v-model="selectedLevel" placeholder="选择日志级别" clearable @change="filterLogs" style="width: 140px;">
                                            <el-option label="全部" value=""></el-option>
                                            <el-option label="DEBUG" value="DEBUG"></el-option>
                                            <el-option label="INFO" value="INFO"></el-option>
                                            <el-option label="WARNING" value="WARNING"></el-option>
                                            <el-option label="ERROR" value="ERROR"></el-option>
                                            <el-option label="CRITICAL" value="CRITICAL"></el-option>
                                        </el-select>
                                        
                                        <!-- 搜索框 -->
                                        <el-input 
                                            v-model="searchText" 
                                            placeholder="搜索日志内容..." 
                                            @input="filterLogs"
                                            clearable
                                            style="flex: 1; max-width: 400px;"
                                        >
                                            <template #prefix>
                                                <el-icon><search></search></el-icon>
                                            </template>
                                        </el-input>
                                        
                                        <!-- 按钮组 -->
                                        <div style="margin-left: auto; display: flex; gap: 10px;">
                                            <el-button @click="toggleAutoRefresh" :type="autoRefresh ? 'success' : 'info'" size="default">
                                                <el-icon><timer></timer></el-icon>
                                                {{ autoRefresh ? '停止自动刷新' : '开始自动刷新' }}
                                            </el-button>
                                            <el-button @click="clearLogs" type="warning" size="default">
                                                <el-icon><delete></delete></el-icon>
                                                清空日志
                                            </el-button>
                                        </div>
                                    </div>
                                </el-card>
                            </el-col>
                        </el-row>

                        <!-- 日志显示区域 -->
                        <el-card shadow="never" class="logs-display">
                            <div class="logs-header">
                                <h3>{{ getLogTypeLabel() }}日志 <span class="timestamp">{{ lastUpdate }}</span></h3>
                                <p style="margin: 0; font-size: 12px; color: #909399;">
                                    📌 最新日志显示在顶部，按时间倒序排列 | 当前显示: {{ getLogTypeLabel() }}
                                </p>
                            </div>
                            
                            <div class="logs-content" ref="logsContainer">
                                <div v-if="filteredLogs.length === 0" class="no-logs">
                                    <el-empty description="暂无日志数据"></el-empty>
                                </div>
                                
                                <div 
                                    v-for="(log, index) in filteredLogs" 
                                    :key="index" 
                                    class="log-entry"
                                    :class="'log-level-' + (log.level || 'info').toLowerCase()"
                                >
                                    <div class="log-compact">
                                        <span class="log-time">{{ formatTime(log.timestamp || log.time || '') }}</span>
                                        <span :class="'log-level log-level-' + (log.level || 'info').toLowerCase()">{{ log.level || 'INFO' }}</span>
                                        <span class="log-text">{{ log.message || log.content || 'No message' }}</span>
                                    </div>
                                </div>
                            </div>
                        </el-card>

            </div>
        </div>
    </div>

    <!-- Vue 和 ElementPlus -->
    <script src="assets/js/vue.prod.js?v=1755703604"></script>
    <script src="assets/js/element-plus.js?v=1755703604"></script>
    <script src="assets/js/axios.js?v=1755703604"></script>
    <script src="assets/js/config/api-endpoints.js?v=1755703604"></script>
    <script src="assets/js/components/navbar.js?v=1755703604"></script>
    
    <!-- 页面脚本 -->
    <script src="assets/js/components/logs.js?v=1755703604"></script>
</body>
</html>
