<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息数据调试工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-panel { 
            background: #f5f5f5; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .message-item { 
            border: 1px solid #ddd; 
            margin: 10px 0; 
            padding: 15px; 
            border-radius: 5px;
        }
        .message-item.has-comparison { background-color: #e8f5e8; }
        .message-item.should-have-comparison { background-color: #fff3cd; }
        .message-item.problem { background-color: #f8d7da; }
        pre { 
            background: #f8f9fa; 
            padding: 10px; 
            border-radius: 3px; 
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .field-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .field-box {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 3px;
        }
        .stats {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔍 消息数据调试工具</h1>
    
    <div class="debug-panel">
        <h2>操作面板</h2>
        <button onclick="fetchAndAnalyzeMessages()">🔄 获取并分析消息</button>
        <button onclick="testSpecificMessage()">🧪 测试特定消息</button>
        <button onclick="exportReport()">📄 导出报告</button>
        <button onclick="clearResults()">🧹 清空结果</button>
    </div>

    <div class="stats" id="stats" style="display: none;">
        <h3>📊 分析统计</h3>
        <div id="statsContent"></div>
    </div>

    <div id="results"></div>

    <script src="assets/js/axios.js"></script>
    <script src="assets/js/config/api-endpoints.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    
    <script>
        let messagesData = [];
        let analysisResults = [];

        async function fetchAndAnalyzeMessages() {
            try {
                console.log('🔄 开始获取消息数据...');
                
                const response = await axios.get(window.API.messages.list, {
                    params: {
                        page: 1,
                        size: 50,
                        status: 'pending' // 主要关注待审核的消息
                    },
                    headers: authManager.getAuthHeaders()
                });

                if (response.data && response.data.data && response.data.data.messages) {
                    messagesData = response.data.data.messages;
                    console.log('✅ 获取消息成功:', messagesData.length, '条');
                    analyzeMessages();
                    displayResults();
                } else {
                    console.error('❌ API返回格式异常:', response.data);
                    alert('获取消息失败：API返回格式异常');
                }
            } catch (error) {
                console.error('❌ 获取消息失败:', error);
                alert('获取消息失败: ' + (error.response?.data?.detail || error.message));
            }
        }

        function analyzeMessages() {
            analysisResults = [];

            messagesData.forEach((message, index) => {
                const analysis = {
                    index: index,
                    id: message.id,
                    messageId: message.message_id,
                    sourceChannel: message.source_channel,
                    status: message.status,
                    isAd: message.is_ad,
                    filterReason: message.filter_reason,
                    
                    // 内容分析
                    hasContent: !!message.content,
                    hasFilteredContent: !!message.filtered_content,
                    contentLength: message.content ? message.content.length : 0,
                    filteredContentLength: message.filtered_content ? message.filtered_content.length : 0,
                    contentsIdentical: message.content === message.filtered_content,
                    
                    // 隐藏链接分析
                    hasRemovedHiddenLinks: !!(message.removed_hidden_links && message.removed_hidden_links.length > 0),
                    removedHiddenLinksCount: message.removed_hidden_links ? message.removed_hidden_links.length : 0,
                    
                    // 重复消息分析
                    isDuplicate: !!(message.duplicate_info && message.duplicate_original_id),
                    duplicateType: message.duplicate_type,
                    
                    // 媒体分析
                    hasMedia: !!message.media_type,
                    mediaType: message.media_type,
                    hasMediaGroup: !!(message.media_group_display && message.media_group_display.length > 0),
                    
                    // 应该显示对比的判断
                    shouldShowContentComparison: shouldShowContentComparison(message),
                    shouldShowDuplicateComparison: !!(message.duplicate_info && message.duplicate_original_id),
                    
                    // 原始消息数据（用于详细检查）
                    rawMessage: message
                };

                // 详细内容比较
                if (analysis.hasContent && analysis.hasFilteredContent) {
                    analysis.contentComparison = {
                        lengthDifference: analysis.contentLength - analysis.filteredContentLength,
                        contentPreview: message.content.substring(0, 100),
                        filteredPreview: message.filtered_content.substring(0, 100),
                        trimEqual: message.content.trim() === message.filtered_content.trim(),
                        whitespaceOnlyDiff: message.content.replace(/\s/g, '') === message.filtered_content.replace(/\s/g, '')
                    };
                }

                // 标记问题消息
                analysis.isProblem = (analysis.hasContent && analysis.hasFilteredContent && 
                                    !analysis.contentsIdentical && !analysis.shouldShowContentComparison);

                analysisResults.push(analysis);
            });

            console.log('🔍 消息分析完成:', analysisResults.length, '条消息');
        }

        function shouldShowContentComparison(message) {
            // 复制前端的逻辑
            return (message.content && message.filtered_content && 
                    message.content !== message.filtered_content) || 
                   (message.removed_hidden_links && message.removed_hidden_links.length > 0);
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            const statsContent = document.getElementById('statsContent');

            // 显示统计信息
            const stats = getStats();
            statsContent.innerHTML = `
                <p><strong>总消息数:</strong> ${stats.total}</p>
                <p><strong>应显示内容对比:</strong> ${stats.shouldShowContentComparison} 条</p>
                <p><strong>应显示重复对比:</strong> ${stats.shouldShowDuplicateComparison} 条</p>
                <p><strong>问题消息:</strong> ${stats.problemMessages} 条 <span style="color: red;">${stats.problemMessages > 0 ? '⚠️' : '✅'}</span></p>
                <p><strong>有内容的消息:</strong> ${stats.hasContent} 条</p>
                <p><strong>有过滤内容的消息:</strong> ${stats.hasFilteredContent} 条</p>
                <p><strong>内容相同的消息:</strong> ${stats.contentsIdentical} 条</p>
                <p><strong>有移除隐藏链接:</strong> ${stats.hasRemovedLinks} 条</p>
            `;
            statsDiv.style.display = 'block';

            // 显示详细消息
            resultsDiv.innerHTML = '';

            analysisResults.forEach((analysis) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-item';
                
                if (analysis.shouldShowContentComparison || analysis.shouldShowDuplicateComparison) {
                    messageDiv.className += ' has-comparison';
                } else if (analysis.isProblem) {
                    messageDiv.className += ' problem';
                } else if (analysis.hasContent && analysis.hasFilteredContent && !analysis.contentsIdentical) {
                    messageDiv.className += ' should-have-comparison';
                }

                messageDiv.innerHTML = `
                    <h3>消息 #${analysis.id} ${analysis.isProblem ? '⚠️ 问题' : analysis.shouldShowContentComparison ? '✅ 正常' : '📝'}</h3>
                    
                    <div><strong>基本信息:</strong></div>
                    <ul>
                        <li>消息ID: ${analysis.messageId}</li>
                        <li>频道: ${analysis.sourceChannel}</li>
                        <li>状态: ${analysis.status}</li>
                        <li>是否广告: ${analysis.isAd ? '是' : '否'}</li>
                        ${analysis.filterReason ? `<li>过滤原因: ${analysis.filterReason}</li>` : ''}
                    </ul>

                    <div><strong>内容分析:</strong></div>
                    <ul>
                        <li>有原始内容: ${analysis.hasContent ? '✅' : '❌'}</li>
                        <li>有过滤内容: ${analysis.hasFilteredContent ? '✅' : '❌'}</li>
                        <li>内容相同: ${analysis.contentsIdentical ? '✅' : '❌'}</li>
                        <li>应显示内容对比: ${analysis.shouldShowContentComparison ? '✅' : '❌'}</li>
                        <li>有移除的隐藏链接: ${analysis.hasRemovedHiddenLinks ? '✅ (' + analysis.removedHiddenLinksCount + '个)' : '❌'}</li>
                    </ul>

                    ${analysis.contentComparison ? `
                    <div><strong>内容对比:</strong></div>
                    <div class="field-comparison">
                        <div class="field-box">
                            <h4>原始内容 (${analysis.contentLength}字符)</h4>
                            <pre>${analysis.contentComparison.contentPreview}${analysis.contentLength > 100 ? '...' : ''}</pre>
                        </div>
                        <div class="field-box">
                            <h4>过滤内容 (${analysis.filteredContentLength}字符)</h4>
                            <pre>${analysis.contentComparison.filteredPreview}${analysis.filteredContentLength > 100 ? '...' : ''}</pre>
                        </div>
                    </div>
                    <ul>
                        <li>长度差异: ${analysis.contentComparison.lengthDifference}</li>
                        <li>仅空白字符差异: ${analysis.contentComparison.whitespaceOnlyDiff ? '是' : '否'}</li>
                        <li>去除前后空白后相同: ${analysis.contentComparison.trimEqual ? '是' : '否'}</li>
                    </ul>
                    ` : ''}

                    ${analysis.isDuplicate ? `
                    <div><strong>重复消息信息:</strong></div>
                    <ul>
                        <li>重复类型: ${analysis.duplicateType}</li>
                        <li>应显示重复对比: ${analysis.shouldShowDuplicateComparison ? '✅' : '❌'}</li>
                    </ul>
                    ` : ''}

                    <details>
                        <summary>📋 查看原始消息数据</summary>
                        <pre>${JSON.stringify(analysis.rawMessage, null, 2)}</pre>
                    </details>
                `;

                resultsDiv.appendChild(messageDiv);
            });
        }

        function getStats() {
            return {
                total: analysisResults.length,
                shouldShowContentComparison: analysisResults.filter(a => a.shouldShowContentComparison).length,
                shouldShowDuplicateComparison: analysisResults.filter(a => a.shouldShowDuplicateComparison).length,
                problemMessages: analysisResults.filter(a => a.isProblem).length,
                hasContent: analysisResults.filter(a => a.hasContent).length,
                hasFilteredContent: analysisResults.filter(a => a.hasFilteredContent).length,
                contentsIdentical: analysisResults.filter(a => a.contentsIdentical).length,
                hasRemovedLinks: analysisResults.filter(a => a.hasRemovedHiddenLinks).length
            };
        }

        function testSpecificMessage() {
            const messageId = prompt('请输入要测试的消息ID:');
            if (!messageId) return;

            const message = messagesData.find(m => m.id == messageId || m.message_id == messageId);
            if (!message) {
                alert('消息未找到');
                return;
            }

            console.group(`🧪 测试消息 #${messageId}`);
            console.log('消息数据:', message);
            console.log('内容比较测试:', {
                content: message.content,
                filtered_content: message.filtered_content,
                equal: message.content === message.filtered_content,
                shouldShow: shouldShowContentComparison(message)
            });
            console.groupEnd();

            const analysis = analysisResults.find(a => a.id == messageId || a.messageId == messageId);
            if (analysis) {
                alert(`消息 #${messageId} 分析结果:\n` + 
                      `应显示对比: ${analysis.shouldShowContentComparison ? '是' : '否'}\n` +
                      `有问题: ${analysis.isProblem ? '是' : '否'}`);
            }
        }

        function exportReport() {
            const report = {
                timestamp: new Date().toISOString(),
                stats: getStats(),
                analyses: analysisResults,
                messages: messagesData
            };

            const blob = new Blob([JSON.stringify(report, null, 2)], {
                type: 'application/json'
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `message-debug-report-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            messagesData = [];
            analysisResults = [];
        }

        // 页面加载完成后自动获取数据
        window.addEventListener('load', () => {
            console.log('🔍 消息调试工具已加载');
        });
    </script>
</body>
</html>
