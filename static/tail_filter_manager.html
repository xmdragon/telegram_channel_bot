<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尾部过滤数据管理</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/css/element-plus.css">
    <link rel="stylesheet" href="assets/css/element-plus-fixes.css">
    <link rel="stylesheet" href="assets/css/modern-ui.css">
    <link rel="stylesheet" href="assets/css/training-common.css">
    <link rel="stylesheet" href="assets/css/training-manager.css">
    <link rel="stylesheet" href="assets/css/training-nav.css">
    <style>
        /* 修复表格操作列覆盖问题 */
        .el-table {
            overflow: auto;
        }
        
        /* 确保表格在小屏幕上能正常滚动 */
        .table-content {
            overflow-x: auto;
        }
        
        /* 操作按钮最小宽度 */
        .el-table .el-table__cell:last-child {
            min-width: 100px;
        }
        
        /* 响应式布局 */
        @media (max-width: 1400px) {
            .el-table {
                font-size: 13px;
            }
            
            .el-table .el-button--small {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 1200px) {
            /* 在小屏幕上调整列宽 */
            .data-table {
                min-width: 1000px;
            }
        }
        
        /* 点击提示样式 */
        .content-preview:hover {
            background-color: #f0f8ff;
            border-radius: 4px;
            padding: 2px 4px;
        }
        
        .content-preview::after {
            content: " 点击查看完整内容";
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav-bar page-title="🤖 AI训练中心"></nav-bar>
        
        <div class="container">
            <!-- 子导航 -->
            <training-nav active-tab="tail"></training-nav>
            <!-- 统计信息栏 -->
            <div class="stats-section compact">
                <div class="stats-inline">
                    <div class="stat-item-inline">
                        <span class="stat-label">总样本数:</span>
                        <span class="stat-value">{{ totalSamples }}</span>
                    </div>
                    <div class="stat-item-inline">
                        <span class="stat-label">有效样本:</span>
                        <span class="stat-value">{{ validSamples }}</span>
                    </div>
                    <div class="stat-item-inline">
                        <span class="stat-label">今日新增:</span>
                        <span class="stat-value">{{ todayAdded }}</span>
                    </div>
                </div>
            </div>

            <!-- 操作工具栏 -->
            <div class="toolbar-section">
                <div class="toolbar-card">
                    <div class="toolbar-content">
                        <div class="toolbar">
                            <div class="toolbar-left">
                                <el-input 
                                    v-model="searchText" 
                                    placeholder="搜索尾部过滤样本..." 
                                    class="search-input"
                                    @input="handleSearch"
                                    clearable>
                                    <template #prefix>
                                        <el-icon><Search /></el-icon>
                                    </template>
                                </el-input>
                            </div>
                            <div class="toolbar-right">
                                <div class="btn-group">
                                    <el-button @click="goToTrainingPage" type="primary" class="btn-primary">
                                        <el-icon><Plus /></el-icon>
                                        前往添加样本
                                    </el-button>
                                    <el-button @click="deleteSelected" type="danger" class="btn-danger" :disabled="!selectedSamples.length">
                                        <el-icon><Delete /></el-icon>
                                        批量删除 ({{ selectedSamples.length }})
                                    </el-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据表格 -->
            <div class="table-section">
                <div class="table-card">
                    <div class="table-header">
                        <h3 class="table-title">📝 尾部过滤样本数据</h3>
                    </div>
                    <div class="table-content">
                        <el-table 
                            :data="samples" 
                            stripe 
                            border
                            v-loading="loading"
                            @selection-change="handleSelectionChange"
                            row-key="id"
                            class="data-table">
                    
                    <el-table-column type="selection" width="55"></el-table-column>
                    
                    <el-table-column prop="id" label="ID" width="80" sortable></el-table-column>
                    
                    
                    <el-table-column label="尾部内容" min-width="400">
                        <template #default="scope">
                            <div v-if="scope.row.tail_content" class="content-preview" @click="showDetail(scope.row)" style="cursor: pointer; color: #409EFF;">
                                {{ truncateText(scope.row.tail_content, 100) }}
                            </div>
                            <span v-else>-</span>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="created_at" label="创建时间" min-width="160" sortable>
                        <template #default="scope">
                            {{ formatTime(scope.row.created_at) }}
                        </template>
                    </el-table-column>
                    
                    <el-table-column label="操作" width="100">
                        <template #default="scope">
                            <el-button type="danger" size="small" class="btn-danger" @click="deleteSample(scope.row)">
                                删除
                            </el-button>
                        </template>
                    </el-table-column>
                        </el-table>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="pagination-section" v-if="totalCount > 0">
                        <el-pagination
                            @current-change="handlePageChange"
                            v-model:current-page="currentPage"
                            :page-size="pageSize"
                            :total="totalCount"
                            layout="total, prev, pager, next, jumper"
                            class="pagination">
                        </el-pagination>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详情对话框 -->
        <el-dialog v-model="detailDialog" title="尾部内容详情" width="60%">
            <div v-if="currentSample">
                <el-descriptions :column="1" border>
                    <el-descriptions-item label="ID">{{ currentSample.id }}</el-descriptions-item>
                    <el-descriptions-item label="创建时间">{{ formatTime(currentSample.created_at) }}</el-descriptions-item>
                </el-descriptions>
                
                <div v-if="currentSample.tail_content">
                    <el-divider></el-divider>
                    <h4>完整尾部内容：</h4>
                    <div class="detail-content" style="white-space: pre-line; background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #409EFF; font-family: 'Consolas', 'Monaco', monospace;">{{ currentSample.tail_content }}</div>
                </div>
            </div>
        </el-dialog>

    </div>

    <script src="assets/js/vue.prod.js"></script>
    <script src="assets/js/element-plus.js"></script>
    <script src="assets/js/axios.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/navbar.js"></script>
    <script src="assets/js/components/training-nav.js"></script>
    <script src="assets/js/components/tail-filter-manager.js"></script>
</body>
</html>
