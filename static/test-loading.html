<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试Loading组件</title>
    <script>window.RESOURCE_VERSION = Date.now();</script>
    <script>
        document.write('<script src="assets/js/core/simple-ui.js?v=' + RESOURCE_VERSION + '"><\/script>');
    </script>
</head>
<body>
    <h1>SimpleUI Loading组件测试</h1>
    
    <button onclick="testLoading()">测试Loading组件</button>
    <button onclick="testLoadingWithMessage()">测试自定义消息</button>
    <button onclick="checkSimpleUI()">检查SimpleUI对象</button>
    
    <div id="output" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>输出：</h3>
        <pre id="console"></pre>
    </div>
    
    <script>
        function log(message) {
            const console = document.getElementById('console');
            console.textContent += message + '\n';
        }
        
        function checkSimpleUI() {
            log('检查window.SimpleUI对象...');
            if (typeof window.SimpleUI === 'undefined') {
                log('❌ window.SimpleUI未定义');
            } else {
                log('✅ window.SimpleUI已定义');
                log('版本: ' + window.SimpleUI.version);
                log('包含的组件:');
                for (let key in window.SimpleUI) {
                    if (typeof window.SimpleUI[key] === 'function' || typeof window.SimpleUI[key] === 'object') {
                        log('  - ' + key + ': ' + typeof window.SimpleUI[key]);
                    }
                }
                
                if (window.SimpleUI.Loading) {
                    log('✅ Loading组件存在');
                    log('Loading组件方法:');
                    for (let method in window.SimpleUI.Loading) {
                        if (typeof window.SimpleUI.Loading[method] === 'function') {
                            log('  - ' + method);
                        }
                    }
                } else {
                    log('❌ Loading组件不存在');
                }
            }
        }
        
        function testLoading() {
            log('测试Loading.show()和Loading.hide()...');
            try {
                if (!window.SimpleUI || !window.SimpleUI.Loading) {
                    log('❌ SimpleUI.Loading未定义');
                    return;
                }
                
                window.SimpleUI.Loading.show();
                log('✅ Loading显示成功');
                
                setTimeout(() => {
                    window.SimpleUI.Loading.hide();
                    log('✅ Loading隐藏成功');
                }, 2000);
            } catch (error) {
                log('❌ 错误: ' + error.message);
            }
        }
        
        function testLoadingWithMessage() {
            log('测试带自定义消息的Loading...');
            try {
                if (!window.SimpleUI || !window.SimpleUI.Loading) {
                    log('❌ SimpleUI.Loading未定义');
                    return;
                }
                
                window.SimpleUI.Loading.show('正在处理，请稍候...');
                log('✅ Loading显示成功（自定义消息）');
                
                setTimeout(() => {
                    window.SimpleUI.Loading.updateMessage('即将完成...');
                    log('✅ 消息更新成功');
                }, 1000);
                
                setTimeout(() => {
                    window.SimpleUI.Loading.hide();
                    log('✅ Loading隐藏成功');
                }, 3000);
            } catch (error) {
                log('❌ 错误: ' + error.message);
            }
        }
        
        // 页面加载完成后自动检查
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                log('页面加载完成，自动检查SimpleUI...');
                checkSimpleUI();
            }, 500);
        });
    </script>
</body>
</html>
