<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - Telegram 消息审核系统</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 动态版本号 - 防缓存 -->
    <script>window.RESOURCE_VERSION = Date.now();</script>
    <script>
        document.write('<link rel="stylesheet" href="assets/css/simple-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/modern-ui.css?v=' + RESOURCE_VERSION + '">');
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            border: 1px solid #e5e7eb;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: var(--primary-color, #5B63D3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }
        
        .login-title {
            font-size: 24px;
            color: var(--text-primary, #111827);
            margin: 0 0 10px;
            font-weight: 600;
        }
        
        .login-subtitle {
            color: var(--text-tertiary, #6B7280);
            font-size: 14px;
        }
        
        .login-form {
            margin-top: 30px;
        }
        
        .form-item {
            margin-bottom: 25px;
        }
        
        .login-button {
            width: 100%;
            height: 45px;
            font-size: 16px;
            border-radius: var(--border-radius-sm, 8px);
            background: var(--primary-color, #5B63D3);
            border: none;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition, all 0.3s ease);
        }
        
        .login-button:hover:not(:disabled) {
            background: var(--primary-hover, #4A52C2);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md, 0 4px 6px rgba(0, 0, 0, 0.07));
        }
        
        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .error-message {
            color: var(--danger-color, #FF4D4F);
            font-size: 12px;
            margin-top: 5px;
            min-height: 20px;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: var(--text-tertiary, #6B7280);
            font-size: 12px;
        }
        
        /* SimpleUI 样式 */
        .simple-input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border: 1px solid var(--border-color, #E5E7EB);
            border-radius: var(--border-radius-sm, 8px);
            font-size: 15px;
            background: white;
            transition: var(--transition, all 0.3s ease);
            color: var(--text-primary, #111827);
        }
        
        .simple-input:focus {
            border-color: var(--primary-color, #5B63D3);
            outline: none;
            box-shadow: 0 0 0 3px rgba(91, 99, 211, 0.1);
        }
        
        .simple-input::placeholder {
            color: var(--text-tertiary, #6B7280);
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }
            
            .login-card {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">T</div>
                    <h1 class="login-title">管理员登录</h1>
                    <p class="login-subtitle">Telegram 消息审核系统</p>
                </div>
                
                <div class="login-form">
                    <div class="form-item">
                        <input 
                            v-model="loginData.username" 
                            class="simple-input"
                            placeholder="请输入用户名"
                            @keyup.enter="handleLogin"
                            autocomplete="username">
                    </div>
                    
                    <div class="form-item">
                        <input 
                            v-model="loginData.password" 
                            type="password" 
                            class="simple-input"
                            placeholder="请输入密码"
                            @keyup.enter="handleLogin"
                            autocomplete="current-password">
                    </div>
                    
                    <div class="error-message" v-show="errorMessage">{{ errorMessage }}</div>
                    
                    <div class="form-item">
                        <button 
                            type="button"
                            class="login-button" 
                            @click="handleLogin"
                            :disabled="loading">
                            <span v-if="!loading">登 录</span>
                            <span v-else>
                                <span class="loading-spinner"></span>
                                登录中...
                            </span>
                        </button>
                    </div>
                </div>
                
                <div class="footer-text">
                    © 2024 Telegram Message Review System
                </div>
            </div>
        </div>
    </div>

    <!-- 动态加载JavaScript文件 -->
    <script>
        document.write('<script src="assets/js/vue.prod.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/core/simple-ui.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/axios.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/axios-config.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/api-endpoints.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/login.js?v=' + RESOURCE_VERSION + '"><\/script>');
    </script>

</body>
</html>
