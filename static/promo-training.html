<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 推广链接训练 - AI训练中心</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 动态版本号 - 防缓存 -->
    <script>window.RESOURCE_VERSION = Date.now();</script>
    <script>
        document.write('<link rel="stylesheet" href="assets/css/simple-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/modern-ui.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/components/inline-styles.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/training-common.css?v=' + RESOURCE_VERSION + '">');
        document.write('<link rel="stylesheet" href="assets/css/training-nav.css?v=' + RESOURCE_VERSION + '">');
    </script>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav-bar page-title="🔗 推广链接训练"></nav-bar>
        
        <div class="container">
            <!-- 子导航 -->
            <training-nav active-tab="promo"></training-nav>
            
            <!-- 推广链接训练表单 -->
            <div class="config-section">
                <div class="form-card">
                    <div class="card-header">
                        <h3>🔗 推广链接训练</h3>
                    </div>
                    
                    <form class="training-form">
                        <div class="form-group">
                            <label class="form-label required">推广内容</label>
                            <textarea
                                class="form-textarea"
                                v-model="promoTrainingForm.promo_content"
                                rows="8"
                                placeholder="粘贴需要过滤的推广内容，例如🔥🔥🔥N9国际娱乐城 充值送8888U"></textarea>
                            <div class="char-count">{{ promoTrainingForm.promo_content.length }} 字符</div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">分隔符类型</label>
                            <select class="form-select" v-model="promoTrainingForm.separator_type">
                                <option value="">选择分隔符类型（可选）</option>
                                <option value="line_separator">横线类 (━━━)</option>
                                <option value="equal_separator">等号类 (===)</option>
                                <option value="plus_separator">加号类 (+++)</option>
                                <option value="emoji_separator">Emoji分隔</option>
                                <option value="no_separator">无明显分隔符</option>
                            </select>
                        </div>
                        
                        <!-- 预览区域 -->
                        <div class="form-group" v-if="promoFilteredPreview">
                            <label class="form-label">过滤后预览</label>
                            <div class="preview-box">
                                <pre>{{ promoFilteredPreview }}</pre>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" @click="clearPromoForm">清空</button>
                            <button type="button" class="btn btn-primary" @click="submitPromoTraining" :disabled="submitting">
                                <span v-if="submitting">提交中...</span>
                                <span v-else>提交推广内容样本</span>
                            </button>
                            <button type="button" class="btn btn-tertiary" @click="previewPromoFilter">预览过滤效果</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 统计信息 -->
            <div class="config-section" v-if="stats">
                <div class="stats-card">
                    <div class="stats-header">
                        <h3>📊 训练统计</h3>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.totalSamples || 0 }}</div>
                            <div class="stat-label">总样本数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.uniqueSamples || 0 }}</div>
                            <div class="stat-label">唯一样本</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.mediaFiles || 0 }}</div>
                            <div class="stat-label">媒体文件</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 消息提示已使用 SimpleUI -->
        </div>
    </div>


    <!-- 动态加载JavaScript文件 -->
    <script>
        document.write('<script src="assets/js/vue.prod.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/core/simple-ui.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/axios.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/axios-config.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/config/api-endpoints.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/admin-auth.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/navbar.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/training-nav.js?v=' + RESOURCE_VERSION + '"><\/script>');
        document.write('<script src="assets/js/components/promo-training.js?v=' + RESOURCE_VERSION + '"><\/script>');
    </script>
</body>
</html>
