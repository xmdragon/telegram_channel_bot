<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 推广链接训练 - AI训练中心</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="assets/css/train.css?v=1755809999">
    <link rel="stylesheet" href="assets/css/training-nav.css?v=1755809999">
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="navbar-content">
                <h1 class="navbar-title">🔗 推广链接训练</h1>
                <button class="btn-back" onclick="window.location.href='/static/admin.html'">← 返回</button>
            </div>
        </nav>
        
        <div class="container">
            <!-- 子导航 - 使用统一组件 -->
            <training-nav active-tab="promo"></training-nav>
            
            <!-- 推广链接训练表单 -->
            <div class="config-section">
                <div class="form-card">
                    <div class="card-header">
                        <h3>🔗 推广链接训练</h3>
                    </div>
                    
                    <form class="training-form">
                        <div class="form-group">
                            <label class="form-label required">完整消息内容</label>
                            <textarea
                                class="form-textarea"
                                v-model="promoTrainingForm.full_content"
                                rows="10"
                                placeholder="粘贴包含尾部推广链接的完整消息内容..."></textarea>
                            <div class="char-count">{{ promoTrainingForm.full_content.length }} 字符</div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">推广链接部分</label>
                            <textarea
                                class="form-textarea"
                                v-model="promoTrainingForm.promo_section"
                                rows="6"
                                placeholder="标记需要过滤的推广链接部分，例如：&#10;🔔 订阅📡东南亚曝光台&#10;🔗  t.me/dny9527&#10;☎️ 投稿曝料：@stan0505"></textarea>
                            <div class="char-count">{{ promoTrainingForm.promo_section.length }} 字符</div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">分隔符类型</label>
                            <select class="form-select" v-model="promoTrainingForm.separator_type">
                                <option value="">选择分隔符类型</option>
                                <option value="line_separator">横线类 (━━━)</option>
                                <option value="equal_separator">等号类 (===)</option>
                                <option value="plus_separator">加号类 (+++)</option>
                                <option value="emoji_separator">Emoji分隔</option>
                                <option value="no_separator">无明显分隔符</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">推广特征</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="订阅频道">
                                    <span class="checkbox-label">订阅频道链接</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="投稿爆料">
                                    <span class="checkbox-label">投稿爆料联系</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="商务合作">
                                    <span class="checkbox-label">商务合作联系</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="多个@用户名">
                                    <span class="checkbox-label">多个@用户名</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="Markdown链接">
                                    <span class="checkbox-label">Markdown格式链接</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" v-model="promoTrainingForm.promo_features" value="直接链接">
                                    <span class="checkbox-label">直接URL链接</span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- 预览区域 -->
                        <div class="form-group" v-if="promoFilteredPreview">
                            <label class="form-label">过滤后预览</label>
                            <div class="preview-box">
                                <pre>{{ promoFilteredPreview }}</pre>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" @click="clearPromoForm">清空</button>
                            <button type="button" class="btn btn-primary" @click="submitPromoTraining" :disabled="submitting">
                                <span v-if="submitting">提交中...</span>
                                <span v-else>提交推广链接训练样本</span>
                            </button>
                            <button type="button" class="btn btn-tertiary" @click="previewPromoFilter">预览过滤效果</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 统计信息 -->
            <div class="config-section" v-if="stats">
                <div class="stats-card">
                    <div class="stats-header">
                        <h3>📊 训练统计</h3>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.totalSamples || 0 }}</div>
                            <div class="stat-label">总样本数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.uniqueSamples || 0 }}</div>
                            <div class="stat-label">唯一样本</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">{{ stats.mediaFiles || 0 }}</div>
                            <div class="stat-label">媒体文件</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 消息提示 -->
            <div v-if="message.text" :class="['message', `message-${message.type}`]" class="message">
                {{ message.text }}
            </div>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div v-if="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">{{ loadingText }}</div>
    </div>

    <!-- 脚本引入 -->
    <script src="assets/js/vue.prod.js?v=1755809999"></script>
    <script src="assets/js/axios.js?v=1755809999"></script>
    <script src="assets/js/config/api-endpoints.js?v=1755809999"></script>
    <script src="assets/js/admin-auth.js?v=1755809999"></script>
    <script defer src="assets/js/components/training-nav.js?v=1755809999"></script>
    <script defer src="assets/js/promo-training.js?v=1755809999"></script>
</body>
</html>
