<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js 调试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .debug-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .debug-section h2 {
            margin-top: 0;
            color: #333;
        }
        .status {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .template-test {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔍 Vue.js 和依赖项诊断页面</h1>
    
    <div class="debug-section">
        <h2>📋 依赖项检查</h2>
        <div id="dependency-status">
            <p>⏳ 正在检查依赖项...</p>
        </div>
    </div>
    
    <div class="debug-section">
        <h2>🧪 Vue.js 初始化测试</h2>
        <div id="vue-test">
            <div id="app">
                <p>⏳ Vue.js 初始化中...</p>
                <p>消息: {{ message || '加载中...' }}</p>
                <p>当前时间: {{ currentTime || '未知' }}</p>
                <button @click="updateMessage" :disabled="!Vue">更新消息</button>
            </div>
        </div>
    </div>
    
    <div class="debug-section">
        <h2>📊 控制台错误</h2>
        <div id="console-errors">
            <p>📝 请检查浏览器开发者工具的控制台查看详细错误信息</p>
        </div>
    </div>

    <!-- 核心依赖项 -->
    <script src="assets/js/vue.prod.js"></script>
    <script src="assets/js/element-plus.js"></script>
    <script src="assets/js/axios.js"></script>
    <script src="assets/js/config/api-endpoints.js"></script>
    
    <script>
        console.log('🚀 开始依赖项检查...');
        
        // 依赖项检查
        function checkDependencies() {
            const deps = [
                { name: 'Vue', obj: window.Vue, required: true },
                { name: 'ElementPlus', obj: window.ElementPlus, required: true },
                { name: 'axios', obj: window.axios, required: true },
                { name: 'API', obj: window.API, required: true },
                { name: 'ElMessage', obj: window.ElMessage, required: false },
                { name: 'createApp', obj: window.Vue?.createApp, required: true }
            ];
            
            const statusDiv = document.getElementById('dependency-status');
            let hasErrors = false;
            let statusHTML = '';
            
            deps.forEach(dep => {
                const exists = typeof dep.obj !== 'undefined' && dep.obj !== null;
                const statusClass = exists ? 'success' : (dep.required ? 'error' : 'warning');
                const icon = exists ? '✅' : (dep.required ? '❌' : '⚠️');
                
                if (!exists && dep.required) {
                    hasErrors = true;
                }
                
                statusHTML += `<div class="status ${statusClass}">${icon} ${dep.name}: ${exists ? '已加载' : '未加载'}</div>`;
                
                if (exists) {
                    console.log(`✅ ${dep.name} 已加载:`, dep.obj);
                } else {
                    console.error(`❌ ${dep.name} 未加载`);
                }
            });
            
            statusDiv.innerHTML = statusHTML;
            return !hasErrors;
        }
        
        // Vue应用初始化
        function initVueApp() {
            console.log('🔄 尝试初始化Vue应用...');
            
            try {
                if (!window.Vue) {
                    throw new Error('Vue.js 未加载');
                }
                
                const { createApp } = Vue;
                
                const app = createApp({
                    data() {
                        return {
                            message: 'Vue.js 已成功初始化！',
                            currentTime: new Date().toLocaleString('zh-CN'),
                            Vue: !!window.Vue
                        };
                    },
                    methods: {
                        updateMessage() {
                            this.message = `消息已更新 - ${new Date().toLocaleTimeString('zh-CN')}`;
                            this.currentTime = new Date().toLocaleString('zh-CN');
                            console.log('✅ Vue方法调用成功');
                        }
                    },
                    mounted() {
                        console.log('✅ Vue应用已挂载');
                        console.log('🎯 Vue实例数据:', this.$data);
                    }
                });
                
                // 使用Element Plus（如果可用）
                if (window.ElementPlus) {
                    app.use(ElementPlus);
                    console.log('✅ Element Plus 已注册');
                }
                
                app.mount('#app');
                console.log('✅ Vue应用挂载成功');
                
                return true;
            } catch (error) {
                console.error('❌ Vue应用初始化失败:', error);
                document.getElementById('app').innerHTML = `
                    <div class="status error">
                        ❌ Vue.js 初始化失败<br>
                        错误: ${error.message}
                    </div>
                `;
                return false;
            }
        }
        
        // 主检查流程
        function runDiagnostics() {
            console.log('🔍 开始诊断流程...');
            
            // 检查依赖项
            const depsOk = checkDependencies();
            
            if (depsOk) {
                console.log('✅ 所有必需依赖项已加载，尝试初始化Vue...');
                setTimeout(() => {
                    const vueOk = initVueApp();
                    if (vueOk) {
                        console.log('🎉 Vue应用初始化成功！');
                    } else {
                        console.error('💥 Vue应用初始化失败！');
                    }
                }, 100);
            } else {
                console.error('💥 依赖项检查失败，无法初始化Vue应用');
            }
        }
        
        // 捕获所有JavaScript错误
        window.addEventListener('error', function(event) {
            console.error('🚨 JavaScript错误:', event.error);
            const errorDiv = document.getElementById('console-errors');
            errorDiv.innerHTML += `
                <div class="status error">
                    ❌ ${event.error?.message || '未知错误'}<br>
                    文件: ${event.filename || '未知'}<br>
                    行号: ${event.lineno || '未知'}
                </div>
            `;
        });
        
        // 在DOM加载完成后运行诊断
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runDiagnostics);
        } else {
            setTimeout(runDiagnostics, 0);
        }
    </script>
</body>
</html>
