# 生产环境Docker Compose配置
# Ubuntu 24.04服务器部署专用

version: '3.8'

services:
  # Nginx反向代理 + 静态文件服务
  nginx:
    image: nginx:alpine
    container_name: telegram_bot_nginx
    ports:
      - "80:80"
      # 443端口被占用，如需SSL请在外部配置反向代理
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
      - ./temp_media:/var/www/media:ro
      - ./data/training/ad:/var/www/training:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL证书
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - telegram-bot-network

  # Python应用服务
  app:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: telegram_bot_app
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
      - WORKERS=4
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp_media:/app/temp_media
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - telegram-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis数据库
  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - telegram-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegram采集服务
  telegram-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: telegram_bot_collector
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp_media:/app/temp_media
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - telegram-bot-network

  # 消息调度服务
  message-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: telegram_bot_scheduler
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - telegram-bot-network

volumes:
  redis_data:
    driver: local

networks:
  telegram-bot-network:
    driver: bridge