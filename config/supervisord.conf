[unix_http_server]
file=/home/grom/telegram_channel_bot/supervisor.sock

[supervisord]
logfile=/home/grom/telegram_channel_bot/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/home/grom/telegram_channel_bot/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/grom/telegram_channel_bot/supervisor.sock

[inet_http_server]
port=127.0.0.1:9001
username=supervisor
password=tg_supervisor_2025

[program:telegram_web]
command=/home/grom/telegram_channel_bot/venv/bin/python3 /home/grom/telegram_channel_bot/web_server.py
directory=/home/grom/telegram_channel_bot
autostart=true
autorestart=true
startretries=3
stderr_logfile=/home/grom/telegram_channel_bot/logs/web_error.log
stdout_logfile=/home/grom/telegram_channel_bot/logs/web_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1",PRODUCTION="false"
priority=10
stopwaitsecs=10

[program:telegram_collector]
command=/home/grom/telegram_channel_bot/venv/bin/python3 /home/grom/telegram_channel_bot/message_collector.py
directory=/home/grom/telegram_channel_bot
autostart=true
autorestart=true
startretries=3
stderr_logfile=/home/grom/telegram_channel_bot/logs/collector_error.log
stdout_logfile=/home/grom/telegram_channel_bot/logs/collector_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1"
priority=20
stopwaitsecs=10

[program:telegram_scheduler]
command=/home/grom/telegram_channel_bot/venv/bin/python3 /home/grom/telegram_channel_bot/message_scheduler.py
directory=/home/grom/telegram_channel_bot
autostart=true
autorestart=true
startretries=3
stderr_logfile=/home/grom/telegram_channel_bot/logs/scheduler_error.log
stdout_logfile=/home/grom/telegram_channel_bot/logs/scheduler_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1"
priority=30
startsecs=10
stopwaitsecs=10

[group:telegram]
programs=telegram_web,telegram_collector,telegram_scheduler
