[unix_http_server]
file=./supervisor.sock

[supervisord]
logfile=./logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=./logs/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://./supervisor.sock

[inet_http_server]
port=127.0.0.1:9001
username=supervisor
password=tg_supervisor_2025

[program:telegram_web]
command=./venv/bin/python3 ./web_server.py
directory=.
autostart=true
autorestart=true
startretries=3
stderr_logfile=./logs/web_error.log
stdout_logfile=./logs/web_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1",PYTHONUNBUFFERED="1",PRODUCTION="false",PYTHONUNBUFFERED="1"
priority=10
stopwaitsecs=10

[program:telegram_collector]
command=./venv/bin/python3 ./message_collector.py
directory=.
autostart=true
autorestart=true
startretries=3
stderr_logfile=./logs/collector_error.log
stdout_logfile=./logs/collector_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1",PYTHONUNBUFFERED="1"
priority=20
stopwaitsecs=10

[program:telegram_scheduler]
command=./venv/bin/python3 ./message_scheduler.py
directory=.
autostart=true
autorestart=true
startretries=3
stderr_logfile=./logs/scheduler_error.log
stdout_logfile=./logs/scheduler_output.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HF_HUB_OFFLINE="1",PYTHONUNBUFFERED="1"
priority=30
startsecs=10
stopwaitsecs=10

[group:telegram]
programs=telegram_web,telegram_collector,telegram_scheduler
