# 生产环境Nginx配置
# 支持SSL、压缩、缓存和负载均衡

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 上游服务器配置
    upstream telegram_bot_app {
        server app:8000;
        keepalive 32;
    }

    # HTTP服务器配置（443端口被占用，只使用HTTP）
    server {
        listen 80;
        server_name _;

        # Let's Encrypt验证支持
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # SSL配置已禁用（443端口被占用）
        # 如需HTTPS，请在外部反向代理配置SSL

        # 客户端最大请求体大小
        client_max_body_size 100M;

        # 静态文件服务
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            
            # 安全配置
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable, no-transform";
            }
        }

        # 媒体文件服务                                                                                       │ │
        location /temp_media/ {                                                                                                │ │
            alias /var/www/media/;                                                                                             │ │
            expires 24h;                                                                                                       │ │
            add_header Cache-Control "public, no-transform";                                                                   │ │
        }

        # 训练数据API（需要认证）
        location /media/ad_training_data/ {
            alias /var/www/training/;
            expires 1h;
            add_header Cache-Control "private, no-transform";
            
            # 这里可以添加认证逻辑
            # auth_request /auth;
        }

        # API代理
        location /api/ {
            proxy_pass http://telegram_bot_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket代理
        location /ws {
            proxy_pass http://telegram_bot_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket特殊配置
            proxy_buffering off;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # 默认页面重定向
        location = / {
            return 302 /static/login.html;
        }

        # 健康检查端点
        location /health {
            proxy_pass http://telegram_bot_app/api/health;
            access_log off;
        }

        # 安全配置 - 隐藏敏感文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|ini|conf|log|bak|backup|old)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}