# 🏗️ Nginx配置文件 - 高性能静态文件服务
# Linus原则：专业工具做专业事，Nginx服务静态文件，FastAPI专注API

server {
    listen 80;
    server_name localhost;
    
    # 🚀 性能优化配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # 🗜️ Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # 📁 静态文件服务 - 高性能缓存
    location /static/ {
        alias /usr/share/nginx/html/static/;
        
        # 💾 强缓存策略
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        
        # 🔒 安全头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # 📊 访问日志（调试用）
        access_log /var/log/nginx/static_access.log;
        
        # 🚫 404处理
        try_files $uri $uri/ =404;
    }
    
    # 📷 临时媒体文件
    location /temp_media/ {
        alias /usr/share/nginx/html/temp_media/;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-temp";
    }
    
    # 🎯 训练数据媒体文件
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-media";
    }
    
    # 🔌 WebSocket代理 - 特殊处理
    location /ws {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket超时配置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        add_header X-Served-By "nginx-websocket";
    }
    
    # 🏠 根路径重定向到主页
    location = / {
        return 301 http://$host:8080/static/index.html;
    }
    
    # 📱 便捷路径重定向
    location = /admin {
        return 301 http://$host:8080/static/login.html;
    }
    
    location = /config {
        return 301 http://$host:8080/static/config.html;
    }
    
    location = /auth {
        return 301 http://$host:8080/static/telegram-auth.html;
    }
    
    # 🌐 API反向代理到FastAPI
    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ⚡ 连接优化
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        add_header X-Served-By "nginx-api";
    }
    
    # 🚫 隐藏nginx版本
    server_tokens off;
    
    # 📝 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

