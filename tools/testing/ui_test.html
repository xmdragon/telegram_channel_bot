<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple UI 功能测试</title>
    <link rel="stylesheet" href="../../static/assets/css/simple-ui.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 { color: #333; }
        h2 { color: #666; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .status { 
            padding: 10px; 
            border-radius: 4px; 
            margin: 10px 0;
            font-weight: bold;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Simple UI 功能测试</h1>
        <p>测试轻量级UI系统是否能正常替代Element Plus</p>
        
        <div id="status" class="status">准备测试...</div>
        
        <div class="test-section">
            <h2>1. 消息提示测试</h2>
            <div class="btn-group">
                <button class="simple-btn simple-btn-success" onclick="testMessage('success')">成功消息</button>
                <button class="simple-btn simple-btn-error" onclick="testMessage('error')">错误消息</button>
                <button class="simple-btn simple-btn-warning" onclick="testMessage('warning')">警告消息</button>
                <button class="simple-btn simple-btn-primary" onclick="testMessage('info')">信息消息</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>2. 对话框测试</h2>
            <div class="btn-group">
                <button class="simple-btn simple-btn-primary" onclick="testConfirm()">确认对话框</button>
                <button class="simple-btn simple-btn-danger" onclick="testConfirmDanger()">危险操作确认</button>
                <button class="simple-btn simple-btn-default" onclick="testAlert()">警告对话框</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>3. API兼容性测试</h2>
            <div class="btn-group">
                <button class="simple-btn simple-btn-primary" onclick="testElMessage()">测试 ElMessage</button>
                <button class="simple-btn simple-btn-primary" onclick="testElMessageBox()">测试 ElMessageBox</button>
                <button class="simple-btn simple-btn-primary" onclick="testObjectParam()">测试对象参数</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>4. 性能测试</h2>
            <div class="btn-group">
                <button class="simple-btn simple-btn-primary" onclick="testPerformance()">批量消息性能测试</button>
                <button class="simple-btn simple-btn-warning" onclick="testStressTest()">压力测试</button>
            </div>
            <div id="performance-result"></div>
        </div>
        
        <div class="test-section">
            <h2>5. 自动化测试结果</h2>
            <div id="auto-test-results"></div>
        </div>
    </div>

    <!-- 加载Simple UI -->
    <script src="../../static/assets/js/core/simple-ui.js"></script>
    <script src="../../static/assets/js/core/ui-wrapper.js"></script>

    <script>
        // 测试函数
        let testsPassed = 0;
        let testsFailed = 0;
        
        function updateStatus(message, success = true) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${success ? 'success' : 'error'}`;
        }
        
        function testMessage(type) {
            const messages = {
                success: '✅ 操作成功！这是一个成功消息示例',
                error: '❌ 操作失败！这是一个错误消息示例',
                warning: '⚠️ 注意警告！这是一个警告消息示例',
                info: 'ℹ️ 提示信息！这是一个信息消息示例'
            };
            
            if (window.SimpleMessage) {
                window.SimpleMessage[type](messages[type]);
                updateStatus(`${type} 消息测试通过`);
            } else {
                updateStatus(`${type} 消息测试失败`, false);
            }
        }
        
        async function testConfirm() {
            try {
                await window.SimpleMessageBox.confirm('确定要执行这个操作吗？', '确认操作');
                updateStatus('确认对话框测试通过 - 用户点击了确定');
            } catch (error) {
                if (error === 'cancel') {
                    updateStatus('确认对话框测试通过 - 用户点击了取消');
                } else {
                    updateStatus('确认对话框测试失败', false);
                }
            }
        }
        
        async function testConfirmDanger() {
            try {
                await window.SimpleMessageBox.confirm(
                    '此操作不可恢复，确定要删除所有数据吗？', 
                    '危险操作',
                    { type: 'danger', confirmButtonText: '删除', cancelButtonText: '保留' }
                );
                updateStatus('危险操作确认测试通过 - 用户确认删除');
            } catch (error) {
                updateStatus('危险操作确认测试通过 - 用户取消操作');
            }
        }
        
        async function testAlert() {
            try {
                await window.SimpleMessageBox.alert('这是一个提示信息', '提示');
                updateStatus('警告对话框测试通过');
            } catch (error) {
                updateStatus('警告对话框测试失败', false);
            }
        }
        
        function testElMessage() {
            if (window.ElMessage) {
                window.ElMessage.success('Element Plus兼容API测试成功');
                updateStatus('ElMessage 兼容性测试通过');
                testsPassed++;
            } else {
                updateStatus('ElMessage 兼容性测试失败', false);
                testsFailed++;
            }
        }
        
        async function testElMessageBox() {
            try {
                if (window.ElMessageBox) {
                    await window.ElMessageBox.confirm('Element Plus兼容性测试', '确认');
                    updateStatus('ElMessageBox 兼容性测试通过');
                    testsPassed++;
                }
            } catch (error) {
                if (error === 'cancel') {
                    updateStatus('ElMessageBox 兼容性测试通过');
                    testsPassed++;
                } else {
                    updateStatus('ElMessageBox 兼容性测试失败', false);
                    testsFailed++;
                }
            }
        }
        
        function testObjectParam() {
            if (window.ElMessage) {
                window.ElMessage({
                    message: '对象参数测试成功',
                    type: 'success',
                    duration: 2000
                });
                updateStatus('对象参数兼容性测试通过');
                testsPassed++;
            }
        }
        
        function testPerformance() {
            const startTime = performance.now();
            const count = 20;
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    window.SimpleMessage.info(`性能测试消息 ${i + 1}`);
                    
                    if (i === count - 1) {
                        const endTime = performance.now();
                        const duration = endTime - startTime;
                        document.getElementById('performance-result').innerHTML = `
                            <p>✅ 批量消息性能测试完成</p>
                            <p>📊 ${count}条消息耗时: ${duration.toFixed(2)}ms</p>
                            <p>⚡ 平均每条: ${(duration / count).toFixed(2)}ms</p>
                        `;
                        updateStatus('性能测试完成');
                    }
                }, i * 100);
            }
        }
        
        function testStressTest() {
            const count = 50;
            let completed = 0;
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    window.SimpleMessage.warning(`压力测试 ${i + 1}/${count}`);
                    completed++;
                    
                    if (completed === count) {
                        updateStatus('压力测试完成 - UI系统稳定');
                    }
                }, i * 50);
            }
        }
        
        // 自动化测试
        function runAutoTests() {
            const results = document.getElementById('auto-test-results');
            let html = '<h3>🤖 自动化测试结果</h3>';
            
            // 1. API存在性检查
            const apis = ['SimpleUI', 'ElMessage', 'ElMessageBox'];
            apis.forEach(api => {
                if (window[api]) {
                    html += `<p>✅ ${api} - 已加载</p>`;
                    testsPassed++;
                } else {
                    html += `<p>❌ ${api} - 未找到</p>`;
                    testsFailed++;
                }
            });
            
            // 2. 方法检查
            const methods = [
                ['ElMessage', 'success'],
                ['ElMessage', 'error'], 
                ['ElMessage', 'warning'],
                ['ElMessage', 'info'],
                ['ElMessageBox', 'confirm'],
                ['ElMessageBox', 'alert']
            ];
            
            methods.forEach(([obj, method]) => {
                if (window[obj] && typeof window[obj][method] === 'function') {
                    html += `<p>✅ ${obj}.${method}() - 方法可用</p>`;
                    testsPassed++;
                } else {
                    html += `<p>❌ ${obj}.${method}() - 方法缺失</p>`;
                    testsFailed++;
                }
            });
            
            // 3. 样式检查
            const style = getComputedStyle(document.body);
            if (document.querySelector('#simple-message-styles') || 
                document.querySelector('#simple-dialog-styles')) {
                html += `<p>✅ CSS样式 - 已注入</p>`;
                testsPassed++;
            } else {
                html += `<p>❌ CSS样式 - 未找到</p>`;
                testsFailed++;
            }
            
            // 4. 总结
            html += `<div style="margin-top: 20px; padding: 15px; border: 2px solid ${testsPassed > testsFailed ? '#28a745' : '#dc3545'}; border-radius: 6px;">`;
            html += `<h4>📊 测试总结</h4>`;
            html += `<p>通过: ${testsPassed} | 失败: ${testsFailed}</p>`;
            html += `<p>成功率: ${((testsPassed / (testsPassed + testsFailed)) * 100).toFixed(1)}%</p>`;
            
            if (testsPassed > testsFailed) {
                html += `<p style="color: #28a745; font-weight: bold;">🎉 Simple UI 替换成功！</p>`;
            } else {
                html += `<p style="color: #dc3545; font-weight: bold;">⚠️ 发现问题，需要检查</p>`;
            }
            html += `</div>`;
            
            results.innerHTML = html;
        }
        
        // 页面加载完成后运行自动测试
        window.addEventListener('load', function() {
            setTimeout(runAutoTests, 1000); // 等待UI组件完全初始化
            updateStatus('Simple UI 测试页面加载完成，开始自动化测试...');
            
            // 显示加载时间
            console.log('🚀 页面加载时间:', performance.now().toFixed(2), 'ms');
        });
        
        // 显示欢迎信息
        console.log('🧪 Simple UI 测试页面');
        console.log('📦 Element Plus 2.1MB → Simple UI 6KB');
        console.log('⚡ 预计性能提升 90%+');
    </script>
</body>
</html>
