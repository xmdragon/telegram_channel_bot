<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API配置测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>API配置加载测试</h1>
    <div id="test-results"></div>
    
    <script>
        // 测试API配置是否正确加载
        function runTests() {
            const results = document.getElementById('test-results');
            results.innerHTML = '';
            
            function addResult(message, type = 'info') {
                const div = document.createElement('div');
                div.className = `test-result ${type}`;
                div.textContent = message;
                results.appendChild(div);
            }
            
            try {
                // 测试1: API对象是否存在
                if (typeof API === 'undefined') {
                    addResult('❌ API对象未定义', 'error');
                    return;
                }
                addResult('✅ API对象已正确加载', 'success');
                
                // 测试2: 检查主要模块
                const modules = ['messages', 'training', 'config', 'adminAuth', 'telegramAuth'];
                modules.forEach(module => {
                    if (API[module]) {
                        addResult(`✅ ${module} 模块已加载`, 'success');
                    } else {
                        addResult(`❌ ${module} 模块缺失`, 'error');
                    }
                });
                
                // 测试3: 检查工具函数
                if (API.utils && typeof API.utils.buildUrl === 'function') {
                    addResult('✅ 工具函数已加载', 'success');
                    
                    // 测试工具函数
                    const testUrl = API.utils.buildUrl('/test', {param1: 'value1', param2: 'value2'});
                    addResult(`📝 URL构建测试: ${testUrl}`, 'info');
                } else {
                    addResult('❌ 工具函数缺失', 'error');
                }
                
                // 测试4: 检查训练模块的具体端点
                if (API.training) {
                    const endpoints = ['tailFilterSamples', 'mediaFiles', 'adSamples'];
                    endpoints.forEach(endpoint => {
                        if (API.training[endpoint]) {
                            addResult(`✅ training.${endpoint} 端点已定义: ${API.training[endpoint]}`, 'success');
                        } else {
                            addResult(`❌ training.${endpoint} 端点缺失`, 'error');
                        }
                    });
                }
                
                // 测试5: 检查带参数的端点函数
                if (API.training && typeof API.training.tailFilterSampleById === 'function') {
                    const testId = '123';
                    const testUrl = API.training.tailFilterSampleById(testId);
                    addResult(`✅ 带参数端点测试: tailFilterSampleById(${testId}) = ${testUrl}`, 'success');
                } else {
                    addResult('❌ 带参数端点函数不可用', 'error');
                }
                
                addResult('🎉 API配置测试完成', 'info');
                
            } catch (error) {
                addResult(`❌ 测试过程中发生错误: ${error.message}`, 'error');
            }
        }
        
        // 页面加载完成后运行测试
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
    
    <!-- 加载API配置文件（模拟实际页面的引用方式） -->
    <script src="../../static/assets/js/config/api-endpoints.js"></script>
</body>
</html>
