<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram相册布局算法测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin-bottom: 40px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .test-title {
            font-size: 18px;
            font-weight: 600;
            color: #00ff41;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .media-preview {
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            margin: 15px 0;
            display: inline-block;
        }
        .test-info {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .layout-debug {
            font-family: monospace;
            background: #0f0f0f;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 11px;
            white-space: pre-wrap;
        }
        .media-item {
            position: absolute;
            background: #333;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
        }
        .media-photo {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }
        .media-video {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #444;
        }
        .btn.active {
            background: #00ff41;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Telegram官方媒体布局算法测试</h1>
        <p>此页面用于测试我们移植的Telegram官方媒体布局算法的正确性。</p>

        <div class="controls">
            <button class="btn" onclick="testLayoutCount(1)">1张图片</button>
            <button class="btn" onclick="testLayoutCount(2)">2张图片</button>
            <button class="btn" onclick="testLayoutCount(3)">3张图片</button>
            <button class="btn" onclick="testLayoutCount(4)">4张图片</button>
            <button class="btn" onclick="testLayoutCount(5)">5张图片</button>
            <button class="btn" onclick="testLayoutCount(6)">6张图片</button>
            <button class="btn" onclick="testLayoutCount(7)">7张图片</button>
            <button class="btn" onclick="testLayoutCount(8)">8张图片</button>
            <button class="btn" onclick="testLayoutCount(9)">9张图片</button>
            <button class="btn" onclick="testLayoutCount(10)">10张图片</button>
        </div>

        <div id="test-results"></div>
    </div>

    <!-- 引入布局算法 -->
    <script src="../../static/assets/js/utils/telegram-album-layout.js"></script>
    
    <script>
        // 生成模拟媒体数据
        function generateMediaItems(count) {
            const items = [];
            const aspectRatios = [
                [4, 3],    // 4:3 标准照片
                [16, 9],   // 16:9 宽屏
                [1, 1],    // 1:1 正方形
                [3, 4],    // 3:4 竖屏
                [21, 9],   // 21:9 超宽屏
                [9, 16],   // 9:16 竖屏视频
            ];
            
            for (let i = 0; i < count; i++) {
                const [width, height] = aspectRatios[i % aspectRatios.length];
                items.push({
                    media_type: Math.random() > 0.7 ? 'video' : 'photo',
                    width: width * 100,
                    height: height * 100,
                    url: `https://via.placeholder.com/${width * 100}x${height * 100}`,
                    display_url: `https://via.placeholder.com/${width * 100}x${height * 100}`
                });
            }
            
            return items;
        }

        // 渲染布局预览
        function renderLayoutPreview(mediaItems, layout) {
            if (!layout || !layout.containerStyle) {
                return '<div style="color: #ff6b6b;">布局计算失败</div>';
            }
            
            const { width, height } = layout.containerStyle;
            
            let html = `
                <div class="media-preview" style="position: relative; width: ${width}px; height: ${height}px;">
            `;
            
            mediaItems.forEach((media, index) => {
                const layoutItem = layout.layout[index];
                if (!layoutItem) return;
                
                const { x, y, width: itemWidth, height: itemHeight } = layoutItem.dimensions;
                const mediaClass = media.media_type === 'video' ? 'media-video' : 'media-photo';
                
                html += `
                    <div class="media-item ${mediaClass}" 
                         style="left: ${x}px; top: ${y}px; width: ${itemWidth}px; height: ${itemHeight}px;">
                        ${media.media_type === 'video' ? '🎬' : '📷'} ${index + 1}
                        <br>
                        <small>${itemWidth}×${itemHeight}</small>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }

        // 测试指定数量的媒体布局
        function testLayoutCount(count) {
            // 重置按钮状态
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const mediaItems = generateMediaItems(count);
            
            try {
                const layout = window.calculateTelegramAlbumLayout({
                    mediaItems,
                    isOwn: false,
                    isMobile: false,
                    maxWidth: 380,
                    spacing: 2
                });
                
                const ratios = mediaItems.map(item => (item.width / item.height).toFixed(2));
                const proportions = ratios.map(ratio => {
                    const r = parseFloat(ratio);
                    return r > 1.2 ? 'w' : (r < 0.8 ? 'n' : 'q');
                }).join('');
                
                const debugInfo = {
                    媒体数量: count,
                    宽高比: ratios.join(', '),
                    比例类型: proportions,
                    容器尺寸: `${layout.containerStyle.width}×${layout.containerStyle.height}`,
                    布局项数: layout.layout.length
                };
                
                const testHtml = `
                    <div class="test-section">
                        <div class="test-title">
                            📐 ${count}张媒体布局测试
                        </div>
                        ${renderLayoutPreview(mediaItems, layout)}
                        <div class="test-info">
                            <strong>布局信息：</strong><br>
                            ${Object.entries(debugInfo).map(([key, value]) => `${key}: ${value}`).join('<br>')}
                        </div>
                        <details>
                            <summary style="cursor: pointer; margin-top: 10px; color: #888;">查看详细布局数据</summary>
                            <div class="layout-debug">${JSON.stringify(layout, null, 2)}</div>
                        </details>
                    </div>
                `;
                
                document.getElementById('test-results').innerHTML = testHtml;
                
            } catch (error) {
                document.getElementById('test-results').innerHTML = `
                    <div class="test-section">
                        <div class="test-title" style="color: #ff6b6b;">
                            ❌ ${count}张媒体布局测试失败
                        </div>
                        <div class="test-info" style="color: #ff6b6b;">
                            错误信息: ${error.message}
                        </div>
                    </div>
                `;
            }
        }
        
        // 页面加载完成后测试3张图片
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => testLayoutCount(3), 100);
        });
    </script>
</body>
</html>
