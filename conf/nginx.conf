# Telegram消息审核系统 - Nginx配置模板
# Linus原则：专业工具做专业事，Nginx服务静态文件，FastAPI专注API
#
# 部署说明：
# 1. 使用generate_nginx_conf.sh生成配置或手动修改占位符
# 2. 复制到nginx配置目录：
#    - macOS: cp conf/nginx_xxx.conf /opt/homebrew/etc/nginx/servers/telegram_bot.conf
#    - WSL/Linux: sudo cp conf/nginx_wsl.conf /etc/nginx/sites-available/telegram_bot
# 3. 重新加载nginx配置：nginx -s reload 或 sudo nginx -s reload

server {
    listen 8080;
    server_name localhost;
    
    # 性能优化配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # 静态文件服务 - 需要根据实际部署路径修改
    location /static/ {
        alias {{PROJECT_PATH}}/static/;  # 🔧 占位符，使用generate_nginx_conf.sh生成实际路径
        
        # 强缓存策略
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        
        # 安全头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # 404处理
        try_files $uri $uri/ =404;
    }
    
    # 临时媒体文件
    location /temp_media/ {
        alias {{PROJECT_PATH}}/temp_media/;  # 🔧 占位符，使用generate_nginx_conf.sh生成实际路径
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-temp";
    }
    
    # 训练数据媒体文件
    location /media/ {
        alias {{PROJECT_PATH}}/data/training/ad/;  # 🔧 占位符，使用generate_nginx_conf.sh生成实际路径
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-media";
    }
    
    # WebSocket代理 - 直连本地
    location /ws {
        proxy_pass http://localhost:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket超时配置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        add_header X-Served-By "nginx-websocket";
    }
    
    # 根路径重定向到主页
    location = / {
        return 301 http://$host:8080/static/index.html;
    }
    
    # 便捷路径重定向
    location = /admin {
        return 301 http://$host:8080/static/login.html;
    }
    
    location = /config {
        return 301 http://$host:8080/static/config.html;
    }
    
    location = /auth {
        return 301 http://$host:8080/static/telegram-auth.html;
    }
    
    # API反向代理到FastAPI - 直连本地
    location / {
        proxy_pass http://localhost:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 连接优化
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        add_header X-Served-By "nginx-api";
    }
    
    # 隐藏nginx版本
    server_tokens off;
    
    # 错误页面
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root {{NGINX_ERROR_ROOT}};  # macOS: /opt/homebrew/var/www, Linux: /usr/share/nginx/html
    }
}