services:
  # 🌐 Nginx - 高性能静态文件服务和反向代理
  # Linus原则：专业工具做专业事
  nginx:
    image: nginx:alpine
    container_name: telegram_bot_nginx
    ports:
      - "8080:80"
    volumes:
      # 📁 静态文件挂载（只读）
      - ./static:/usr/share/nginx/html/static:ro
      - ./temp_media:/usr/share/nginx/html/temp_media:ro  
      - ./data/training/ad:/usr/share/nginx/html/media:ro
      # 📝 配置文件
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - telegram_network
    restart: unless-stopped
    depends_on:
      - redis
    # 🔍 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/static/favicon.svg"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 让容器访问宿主机
  
  # 应用服务已迁移到本地运行，通过nginx反向代理访问
  # 使用 python3 main.py 或 ./dev.sh 启动应用
  
  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis
    ports:
      - "6379:6379"
    # 移除volumes挂载以解决macOS Colima权限问题
    # volumes:
    #   - ./data/redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    networks:
      - telegram_network

networks:
  telegram_network:
    driver: bridge
