services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot_app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    depends_on:
      - redis
    volumes:
      # 持久化数据目录
      - ./logs:/app/logs
      - ./data:/app/data
      - ./temp_media:/app/temp_media
    restart: unless-stopped
    networks:
      - telegram_network

  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - telegram_network

networks:
  telegram_network:
    driver: bridge
