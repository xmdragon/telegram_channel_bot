services:
  # 应用服务已迁移到本地运行，无需Docker容器
  # 使用 python3 main.py 或 ./dev.sh 启动应用
  
  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis
    ports:
      - "6379:6379"
    volumes:
      # Redis数据持久化
      - ./data/redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    networks:
      - telegram_network

networks:
  telegram_network:
    driver: bridge
